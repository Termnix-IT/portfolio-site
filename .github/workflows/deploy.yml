name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 型とテンプレートの検査。コンテンツの項目漏れは次の build で zod スキーマが検出する
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: site-bundle
          path: dist

  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: site-bundle
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Sync files to S3
        run: |
          # Astro が出力する _astro/ はファイル名に内容のハッシュが入るため 1 年キャッシュにする。
          # HTML より先に置き、古い _astro/ は消さない（CloudFront に古い HTML が残っている間も CSS・JS・画像を返せるようにするため）。
          aws s3 sync ./dist "s3://${S3_BUCKET_NAME}" \
            --exclude "*" --include "_astro/*" \
            --cache-control "public, max-age=31536000, immutable"
          # og:image などの版の付かない固定パスは 1 日キャッシュにする
          aws s3 sync ./dist "s3://${S3_BUCKET_NAME}" --delete \
            --exclude "*" --include "static/*" \
            --cache-control "public, max-age=86400"
          # HTML は毎回更新を確認させる
          aws s3 sync ./dist "s3://${S3_BUCKET_NAME}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
